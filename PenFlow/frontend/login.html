
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PenFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <div class="page-brand"><img src="./images/pencil-icon.png" alt="Penflow logo"><span>Penflow</span></div>

  <div class="login-page">
    <div class="login-container">
      <h1>Welcome Back ✨</h1>
      <p class="subtitle">Log in to continue your study journey with PenFlow</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group password-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="off" required>
          <span class="toggle-password" data-target="password">👁</span>
        </div>

        <button type="submit" class="form-btn">Login</button>
      </form>

      <p class="account-text">
        Don’t have an account?
        <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </div>
<script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
