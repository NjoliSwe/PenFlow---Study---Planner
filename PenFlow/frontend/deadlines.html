<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Deadlines - PenFlow</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="./css/layout.css" rel="stylesheet"/>
<link href="./css/deadlines.css" rel="stylesheet"/>
</head>
<body>
<header>
  <div class="logo">
    <img alt="Penflow logo" class="brand-logo" src="./images/pencil-icon.png"/><span>Penflow</span>
  </div>
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <div class="profile">
    <span class="greeting">Hello, <span id="userName">Student</span> 👋</span>
  </div>
</header>
<aside class="sidebar" id="sidebar">
  <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
  <div class="nav-menu-title">MENU</div>
  <ul class="nav-menu">
    <li><a href="HomePage.html">Home</a></li>
    <li><a href="courses.html">Courses</a></li>
    <li><a class="active" href="deadlines.html">Deadlines</a></li>
    <li><a href="studyplan.html">Study Plan</a></li>
    <li><a href="availability.html">Availability</a></li>
    <li><a href="reminders.html">Reminders</a></li>
    <li><a href="progress.html">Progress</a></li>
    <li><a href="statistics.html">Statistics</a></li>
    <li><button class="logout-btn" id="logoutBtn" type="button">Log Out</button></li>
  </ul>
</aside>
<main>
  <h1 class="page-title">Deadlines</h1>
  <div class="deadline-form-panel">
    <h2>Add Deadline</h2>
    <div class="form-content">
      <div class="form-row">
        <label for="courseSelect">Course</label>
        <select id="courseSelect"></select>
      </div>
      <div class="form-row">
        <label for="deadlineTitle">Task Title</label>
        <input id="deadlineTitle" placeholder="e.g. Project 1" type="text"/>
      </div>
      <div class="form-row">
        <label for="deadlineType">Type</label>
        <select id="deadlineType">
          <option value="assignment">Assignment</option>
          <option value="exam">Exam</option>
          <option value="quiz">Quiz</option>
          <option value="project">Project</option>
        </select>
      </div>
      <div class="form-row">
        <label for="dueDate">Due Date</label>
        <input id="dueDate" type="date"/>
      </div>
      <div class="form-row">
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="high">High</option>
          <option selected="" value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="form-buttons">
        <button class="btn btn-primary" id="addDeadlineBtn">Add Deadline</button>
      </div>
    </div>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">All</button>
    <button class="filter-tab" data-filter="assignment">Assignments</button>
    <button class="filter-tab" data-filter="exam">Exams</button>
    <button class="filter-tab" data-filter="quiz">Quizzes</button>
    <button class="filter-tab" data-filter="project">Projects</button>
  </div>

  <div class="deadline-list" id="deadlinesContainer"></div>
</main>
<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('show');
  }
</script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/deadlines.js"></script>

</body>
</html>
