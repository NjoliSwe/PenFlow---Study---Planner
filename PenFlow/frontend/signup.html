
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - PenFlow</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="./css/login.css" rel="stylesheet"/>

</head>
<body>
  <div class="page-brand"><img src="./images/pencil-icon.png" alt="Penflow logo"><span>Penflow</span></div>
<div class="login-page">
<div class="login-container">
<h1>Create Account </h1>
<p class="subtitle">Start organizing your study life with PenFlow</p>
<form id="signupForm">
<div class="form-group">
<label for="fullName">Full Name</label>
<input id="fullName" placeholder="Enter your name" required="" type="text"/>
</div>
<div class="form-group">
<label for="signupEmail">Email</label>
<input id="signupEmail" placeholder="Enter your email" required="" type="email"/>
</div>
<div class="form-group password-field">
<label for="signupPassword">Password</label>
<input id="signupPassword" placeholder="Create a password" required="" type="password"/>
<span class="toggle-password" data-target="signupPassword">👁</span>
</div>
<div class="form-group password-field">
<label for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" placeholder="Confirm password" required="" type="password"/>
<span class="toggle-password" data-target="confirmPassword">👁</span>
</div>
<button class="form-btn" type="submit">Create Account</button>
</form>
<p class="account-text">
        Already have an account?
        <a href="login.html">Login</a>
</p>
</div>
</div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</body>
</html>
